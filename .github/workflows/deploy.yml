name: Deploy to DigitalOcean

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/do_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
            cd /tmp
            rm -rf portfolio-build
            git clone git@github.com:nadlambino/portfolio-v2.git portfolio-build
            cd portfolio-build
            git fetch origin master
            git reset --hard origin/master
            npm ci
            npm run build
            docker cp dist/. portfolio:/usr/share/nginx/html
            docker exec portfolio nginx -s reload
